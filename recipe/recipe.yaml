schema_version: 1

context:
  name: webdriver-manager
  version: "4.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/webdriver_manager-${{ version }}.tar.gz
  sha256: 3832f4ab2186c86496b5c0a6d362357a294ca8c2be9972b49d089b809e262687

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=69
    - wheel
  run:
    - python >=${{ python_min }}
    - requests
    - python-dotenv
    - packaging

tests:
  - python:
      imports:
        - webdriver_manager
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Library provides the way to automatically manage drivers for different browsers
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/SergeyPirogov/webdriver_manager

extra:
  recipe-maintainers:
    - thewchan
